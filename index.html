<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>PID Diagnostics and Treatments | Real World CE</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,500,1,0" rel="stylesheet">
  <style>
    :root {
      --rwce-blue: #2563eb;
      --rwce-indigo: #3730a3;
      --rwce-slate: #0f172a;
      --rwce-soft: #eff6ff;
      --rwce-border: rgba(226,232,240,0.9);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background:
        radial-gradient(circle at top left, rgba(59,130,246,0.10), transparent 28%),
        radial-gradient(circle at top right, rgba(99,102,241,0.12), transparent 32%),
        linear-gradient(180deg, #f8fbff 0%, #f8fafc 42%, #f1f5f9 100%);
    }
    .custom-scroll::-webkit-scrollbar { width: 8px; }
    .custom-scroll::-webkit-scrollbar-track { background: transparent; }
    .custom-scroll::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 999px; }
    .fade-in { animation: fadeIn 0.35s ease-out forwards; }
    .slide-up { animation: slideUp 0.42s ease-out forwards; }
    .scale-in { animation: scaleIn 0.24s ease-out forwards; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes scaleIn { from { opacity: 0; transform: scale(.98); } to { opacity: 1; transform: scale(1); } }

    .glass-cmv {
      background: rgba(255,255,255,0.82);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(226, 232, 240, 0.95);
      box-shadow: 0 10px 35px rgba(15, 23, 42, 0.05);
    }
    .sidebar-shell {
      background: rgba(255,255,255,0.94);
      backdrop-filter: blur(18px);
      box-shadow: 10px 0 35px rgba(15, 23, 42, 0.05);
    }
    .hero-panel {
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 15% 10%, rgba(125,211,252,0.22), transparent 30%),
        radial-gradient(circle at 85% 20%, rgba(129,140,248,0.25), transparent 36%),
        linear-gradient(135deg, #0f172a 0%, #1d4ed8 48%, #312e81 100%);
      box-shadow: 0 24px 60px rgba(30, 64, 175, 0.22);
    }
    .hero-panel:before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
      background-size: 34px 34px;
      mask-image: linear-gradient(to bottom, rgba(0,0,0,.65), rgba(0,0,0,.18));
      pointer-events: none;
    }
    .section-card {
      background: rgba(255,255,255,0.88);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(226, 232, 240, 0.9);
      box-shadow: 0 12px 28px rgba(15, 23, 42, 0.05);
    }
    .metric-pill {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      padding: .5rem .75rem;
      border-radius: 999px;
      background: rgba(255,255,255,0.14);
      border: 1px solid rgba(255,255,255,0.18);
      color: rgba(255,255,255,0.92);
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .01em;
    }
    .section-badge {
      color: #dbeafe;
      border: 1px solid rgba(191,219,254,.18);
      background: rgba(255,255,255,.08);
      backdrop-filter: blur(8px);
    }
    .blue-glow {
      box-shadow: 0 0 0 1px rgba(59,130,246,0.14), 0 14px 35px rgba(37,99,235,0.10);
    }
    .nav-progress {
      background: linear-gradient(90deg, #2563eb 0%, #4f46e5 100%);
    }
    .nav-active {
      background: linear-gradient(135deg, rgba(37,99,235,.12), rgba(79,70,229,.10));
      border: 1px solid rgba(59,130,246,.18);
      color: #0f172a;
      box-shadow: 0 8px 18px rgba(37,99,235,.08);
      font-weight: 700;
    }
    .choice-card { transition: all .18s ease; }
    .choice-card:hover { transform: translateY(-1px); }
    .soft-divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(148,163,184,.5), transparent);
    }
    .sim-pulse { animation: simPulse 2.2s ease-in-out infinite; }
    @keyframes simPulse {
      0%,100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(96,165,250,.25); }
      50% { transform: scale(1.03); box-shadow: 0 0 0 14px rgba(96,165,250,0); }
    }
    .sim-progress-bar { transition: width .9s linear; }
    .sim-fade { animation: simFade .45s ease-out forwards; }
    @keyframes simFade { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    .fade-swap { transition: opacity 280ms ease, transform 280ms ease; will-change: opacity, transform; }
    .swap-hidden { opacity: 0; transform: translateY(6px); pointer-events: none; }
    .swap-visible { opacity: 1; transform: translateY(0); }
    .group\/dl:hover .tooltip-dl { opacity: 1; transform: translateY(0); }

    .top-chip {
      border: 1px solid rgba(226,232,240,.9);
      background: rgba(255,255,255,.76);
      backdrop-filter: blur(8px);
    }
    .section-marker {
      background: linear-gradient(180deg, #2563eb, #4f46e5);
      box-shadow: 0 8px 16px rgba(37,99,235,.22);
    }
    .overview-card {
      border: 1px solid rgba(226,232,240,.95);
      background:
        radial-gradient(circle at top right, rgba(59,130,246,.08), transparent 34%),
        rgba(255,255,255,.92);
    }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      padding: .38rem .7rem;
      border-radius: 999px;
      font-size: .76rem;
      font-weight: 800;
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    .status-complete {
      background: #dcfce7;
      color: #166534;
    }
    .status-current {
      background: #dbeafe;
      color: #1d4ed8;
    }
    .status-upcoming {
      background: #f1f5f9;
      color: #475569;
    }

    .safe-wrap { overflow-wrap: normal; word-break: normal; }

    .section-card,
    .overview-card,
    .hero-panel,
    .rounded-2xl,
    .rounded-3xl,
    .top-chip,
    .metric-pill {
      overflow-wrap: normal;
      word-break: normal;
    }

    #main-content {
      max-width: 100%;
    }

    .section-card,
    .overview-card {
      padding-left: 1.75rem;
      padding-right: 1.75rem;
    }

    .section-card h1,
    .section-card h2,
    .section-card h3,
    .section-card p,
    .overview-card h1,
    .overview-card h2,
    .overview-card h3,
    .overview-card p,
    .section-card li,
    .overview-card li {
      max-width: 68ch;
    }

    .hero-panel p,
    .hero-panel h1 {
      max-width: 32ch;
    }

    #breadcrumb-section,
    #sidebar-current-label {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      display: block;
    }

    .module-map-label {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: block;
    }

    .knowledge-check-question {
      line-height: 1.45;
      max-width: 62ch;
    }

    .top-chip,
    .status-pill {
      white-space: nowrap;
    }

    @media (max-width: 1024px) {
      .section-card h1,
      .section-card h2,
      .section-card h3,
      .section-card p,
      .overview-card h1,
      .overview-card h2,
      .overview-card h3,
      .overview-card p,
      .section-card li,
      .overview-card li,
      .hero-panel p,
      .hero-panel h1 {
        max-width: none;
      }

      .top-chip,
      .status-pill {
        white-space: normal;
      }
    }
  </style>
</head>
<body class="text-slate-900 h-screen flex overflow-hidden">
  <aside class="sidebar-shell border-r border-slate-200/80 flex-shrink-0 transition-all duration-300 w-80 flex flex-col z-20 absolute md:relative h-full transform md:transform-none -translate-x-full md:translate-x-0" id="sidebar">
    <div class="px-5 py-5 border-b border-slate-100 min-h-[108px]">
      <div class="text-[11px] uppercase tracking-[0.26em] text-blue-600 font-extrabold"></div>
      <div class="mt-2 text-2xl font-extrabold tracking-tight text-slate-900">PID Diagnostics and Treatments</div>
      <div class="mt-2 text-sm text-slate-500 leading-relaxed">Interactive clinical education track with guided learning, patient cases, and mastery checks.</div>
      <div class="mt-4 flex items-center gap-2">
        <span class="status-pill status-current" id="sidebar-current-chip">In Progress</span>
        <span class="text-xs text-slate-400">6 sections</span>
      </div>
    </div>

    <div class="px-4 pt-4">
      <div class="rounded-3xl bg-slate-900 text-white p-4 blue-glow">
        <div class="flex justify-between text-[11px] text-slate-300 mb-2 font-semibold uppercase tracking-[0.18em]">
          <span>Module Progress</span>
          <span id="sidebar-progress-label">0%</span>
        </div>
        <div class="h-2.5 w-full rounded-full bg-slate-700/60 overflow-hidden">
          <div id="sidebar-progress-bar" class="h-full nav-progress rounded-full transition-all duration-500" style="width:0%"></div>
        </div>
        <div class="grid grid-cols-2 gap-3 mt-4 text-sm">
          <div class="rounded-2xl bg-white/6 border border-white/10 p-3">
            <div class="text-[11px] uppercase tracking-[0.18em] text-slate-300 font-semibold">Completed</div>
            <div id="sidebar-complete-count" class="text-xl font-extrabold mt-1">0</div>
          </div>
          <div class="rounded-2xl bg-white/6 border border-white/10 p-3">
            <div class="text-[11px] uppercase tracking-[0.18em] text-slate-300 font-semibold">Current</div>
            <div id="sidebar-current-label" class="text-sm font-bold mt-1 leading-snug">Diagnosis</div>
          </div>
        </div>
      </div>
    </div>

    <div class="px-4 pt-4">
      <p class="text-[11px] text-slate-400 px-2 mb-3 uppercase tracking-[0.22em] font-bold">Module Map</p>
    </div>
    <div class="px-4 pb-5 space-y-6 overflow-y-auto custom-scroll flex-1">
      <div id="nav-container"></div>
    </div>
  </aside>

  <div class="fixed inset-0 bg-slate-950/40 z-10 hidden md:hidden" id="sidebar-overlay" onclick="toggleSidebar()"></div>

  <div class="flex-1 flex flex-col h-full overflow-hidden relative">
    <header class="sticky top-0 z-50 glass-cmv">
      <div class="w-full px-5 py-3.5 flex items-center justify-between gap-4">
        <div class="flex items-center gap-3 min-w-0">
          <button class="p-2 hover:bg-slate-100 rounded-xl text-slate-600 md:hidden" onclick="toggleSidebar()">
            <span class="material-symbols-outlined">menu</span>
          </button>
          <div class="leading-tight min-w-0">
            <div class="text-base sm:text-lg font-extrabold tracking-tight uppercase text-slate-900 whitespace-nowrap leading-tight">REAL WORLD <span class="text-blue-600">CE</span></div>
            <div class="text-[10px] font-semibold tracking-[0.22em] uppercase text-slate-500 mt-1">Featuring: <span class="font-extrabold text-slate-900">REAL</span> <span class="font-extrabold text-blue-600">DATA</span></div>
          </div>
        </div>

        <div class="hidden lg:flex items-center gap-2 px-3 py-2 rounded-full bg-white/80 border border-slate-200 shadow-sm text-sm text-slate-500">
          <span class="capitalize font-bold text-slate-900" id="breadcrumb-module">Module</span>
          <span class="material-symbols-outlined text-sm text-blue-600">chevron_right</span>
          <span id="breadcrumb-section" class="font-semibold max-w-[260px] leading-tight">Section</span>
        </div>
      </div>
    </header>

    <main class="flex-1 overflow-y-auto p-4 md:p-8 bg-transparent scroll-smooth" id="main-content"></main>
  </div>

<script>
const STORAGE_KEY = 'rwce_pid_module_progress_v2';

const appData = {
  modules: {
    pid: {
      title: 'PID Track',
      color: 'blue',
      sections: [
        { id:'diagnosis', title:'1. Diagnostic Delays', shortTitle:'Diagnosis', icon:'troubleshoot', est:'6 min' },
        { id:'treatment', title:'2. Targeted Therapies', shortTitle:'Therapies', icon:'vaccines', est:'5 min' },
        { id:'monitoring', title:'3. Care & Transition', shortTitle:'Transition', icon:'handshake', est:'5 min' },
        { id:'case-marcus', title:'Case 1: Adult Onset', shortTitle:'Marcus', icon:'person', est:'4 min' },
        { id:'case-sarah', title:'Case 2: Rare Genetic', shortTitle:'Sarah', icon:'science', est:'4 min' },
        { id:'case-david', title:'Case 3: Transition', shortTitle:'David', icon:'escalator_warning', est:'4 min' }
      ]
    }
  }
};

let activeModuleId = 'pid';
let activeSectionId = 'diagnosis';
let quizStates = {};
let completedSections = {};

function saveState() {
  const payload = { activeModuleId, activeSectionId, quizStates, completedSections };
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(payload)); } catch (e) {}
}
function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const state = JSON.parse(raw);
    if (state.activeModuleId) activeModuleId = state.activeModuleId;
    if (state.activeSectionId) activeSectionId = state.activeSectionId;
    if (state.quizStates) quizStates = state.quizStates;
    if (state.completedSections) completedSections = state.completedSections;
  } catch (e) {}
}
function totalSections() {
  return appData.modules[activeModuleId].sections.length;
}
function getCompletedCount() {
  return Object.values(completedSections).filter(Boolean).length;
}
function getProgressPercent() {
  return Math.round((getCompletedCount() / totalSections()) * 100);
}
function getCurrentSectionIndex() {
  return appData.modules[activeModuleId].sections.findIndex(s => s.id === activeSectionId);
}
function getSectionState(sectionId) {
  if (completedSections[sectionId]) return 'complete';
  if (activeSectionId === sectionId) return 'current';
  return 'upcoming';
}
function markSectionComplete(sectionId = activeSectionId) {
  completedSections[sectionId] = true;
  saveState();
  renderMainContent();
}
function resetModuleProgress() {
  completedSections = {};
  quizStates = {};
  saveState();
  renderMainContent();
}

window.downloadMedia = async function(url, filename) {
  try {
    const response = await fetch(url);
    if (!response.ok) throw new Error('Network response was not ok');
    const blob = await response.blob();
    const blobUrl = window.URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.style.display = 'none';
    a.href = blobUrl;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    window.URL.revokeObjectURL(blobUrl);
    document.body.removeChild(a);
  } catch (error) {
    console.warn('Direct download blocked by CORS. Opening in new tab instead.', error);
    window.open(url, '_blank');
  }
};

function topUtilityBar() {
  return `
    <div class="flex flex-wrap items-center justify-between gap-3 mb-5">
      <div class="flex flex-wrap gap-2">
        <div class="top-chip rounded-full px-4 py-2 text-sm font-semibold text-slate-700">Interactive track</div>
        <div class="top-chip rounded-full px-4 py-2 text-sm font-semibold text-slate-700">${getCompletedCount()} of ${totalSections()} sections complete</div>
        <div class="top-chip rounded-full px-4 py-2 text-sm font-semibold text-slate-700">Estimated total: 28 min</div>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="markSectionComplete()" class="rounded-full bg-slate-900 text-white px-4 py-2 text-sm font-semibold hover:bg-slate-800 transition">Mark section complete</button>
        <button onclick="resetModuleProgress()" class="rounded-full bg-white border border-slate-200 px-4 py-2 text-sm font-semibold text-slate-600 hover:bg-slate-50 transition">Reset</button>
      </div>
    </div>
  `;
}

function moduleOverviewCards() {
  const sections = appData.modules[activeModuleId].sections;
  return `
    <div class="grid md:grid-cols-3 gap-4 mb-6">
      <div class="overview-card rounded-3xl p-5">
        <div class="text-[11px] uppercase tracking-[0.22em] text-slate-500 font-bold">Learning Focus</div>
        <div class="mt-2 text-xl font-extrabold text-slate-900">Earlier recognition and precision treatment</div>
        <p class="mt-2 text-sm text-slate-600 leading-relaxed">Built to move clinicians from passive pattern recognition to structured screening, targeted therapy selection, and transition planning.</p>
      </div>
      <div class="overview-card rounded-3xl p-5">
        <div class="text-[11px] uppercase tracking-[0.22em] text-slate-500 font-bold">What is inside</div>
        <div class="mt-2 text-xl font-extrabold text-slate-900">${sections.length} guided sections</div>
        <p class="mt-2 text-sm text-slate-600 leading-relaxed">Core evidence, practical care frameworks, and three patient cases that connect the science to real-world decision-making.</p>
      </div>
      <div class="overview-card rounded-3xl p-5">
        <div class="text-[11px] uppercase tracking-[0.22em] text-slate-500 font-bold">Mastery Design</div>
        <div class="mt-2 text-xl font-extrabold text-slate-900">Embedded knowledge checks</div>
        <p class="mt-2 text-sm text-slate-600 leading-relaxed">Each section ends with a high-yield checkpoint and rationale so the learning feels more like a premium clinical platform.</p>
      </div>
    </div>
  `;
}

function heroBlock(title, subtitle, chips = []) {
  const chipsHtml = chips.map(chip => `
    <div class="metric-pill rounded-xl px-4 py-3">
      <div class="text-[11px] uppercase tracking-[0.22em] text-blue-100/80 font-semibold">${chip.label}</div>
      <div class="text-xl font-extrabold text-white mt-1">${chip.value}</div>
    </div>
  `).join('');
  return `
    <div class="hero-panel rounded-[30px] p-7 md:p-8 text-white shadow-xl mb-6">
      <div class="relative z-10 max-w-3xl">
        <div class="inline-flex items-center gap-2 section-badge rounded-full px-3 py-1 text-[11px] font-bold uppercase tracking-[0.20em] mb-4">Clinical Education</div>
        <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight mb-3">${title}</h1>
        <p class="text-blue-100 text-lg max-w-2xl leading-relaxed">${subtitle}</p>
      </div>
      ${chips.length ? `<div class="relative z-10 grid grid-cols-1 sm:grid-cols-3 gap-3 mt-7 max-w-3xl">${chipsHtml}</div>` : ''}
    </div>
  `;
}
function sectionShell(inner) {
  return `<div class="space-y-6 max-w-6xl mx-auto slide-up">${topUtilityBar()}${inner}</div>`;
}
function sectionIntro(title, subtitle, icon='stethoscope') {
  return `
    <div class="section-card rounded-3xl p-5 md:p-6">
      <div class="flex flex-wrap items-start justify-between gap-4">
        <div class="flex items-start gap-4">
          <div class="section-marker w-12 h-12 rounded-2xl flex items-center justify-center text-white">
            <span class="material-symbols-outlined">${icon}</span>
          </div>
          <div>
            <div class="text-[11px] uppercase tracking-[0.22em] text-slate-500 font-bold">Section Focus</div>
            <h2 class="text-xl font-extrabold text-slate-900 mt-1">${title}</h2>
            <p class="text-slate-600 text-sm md:text-base mt-2 max-w-3xl leading-relaxed">${subtitle}</p>
          </div>
        </div>
        <div class="rounded-2xl bg-slate-50 border border-slate-200 px-4 py-3 min-w-[170px]">
          <div class="text-[11px] uppercase tracking-[0.18em] text-slate-500 font-bold">Estimated Time</div>
          <div class="text-lg font-extrabold text-slate-900 mt-1">${appData.modules[activeModuleId].sections[getCurrentSectionIndex()].est}</div>
        </div>
      </div>
    </div>
  `;
}
function sectionStepper() {
  const sections = appData.modules[activeModuleId].sections;
  return `
    <div class="section-card rounded-3xl p-4 md:p-5">
      <div class="flex flex-wrap gap-3">
        ${sections.map((section, idx) => {
          const state = getSectionState(section.id);
          const stateClass = state === 'complete' ? 'status-complete' : state === 'current' ? 'status-current' : 'status-upcoming';
          return `
            <button onclick="navigateTo('${activeModuleId}','${section.id}')" class="flex-1 min-w-[220px] text-left rounded-2xl border border-slate-200 bg-white px-4 py-3 hover:shadow-sm transition">
              <div class="flex items-center justify-between gap-2">
                <div class="font-bold text-slate-900 text-sm module-map-label">${idx + 1}. ${section.shortTitle}</div>
                <span class="status-pill ${stateClass}">${state}</span>
              </div>
              <div class="text-xs text-slate-500 mt-2">${section.est}</div>
            </button>
          `;
        }).join('')}
      </div>
    </div>
  `;
}

function renderQuizComponent(id, question, options, correctIndex, explanation) {
  const state = quizStates[id] || { submitted:false, selected:null };
  const isCorrect = state.selected === correctIndex;

  const optionsHtml = options.map((opt, idx) => {
    let style = `bg-white border-slate-200 hover:border-blue-300 hover:shadow-sm`;
    let icon = '<div class="w-5 h-5 rounded-full border border-slate-300"></div>';
    if (!state.submitted && state.selected === idx) {
      style = `bg-blue-50 border-blue-500 ring-1 ring-blue-500`;
      icon = `<div class="w-5 h-5 rounded-full border border-blue-500 bg-white flex items-center justify-center"><div class="w-2.5 h-2.5 rounded-full bg-blue-500"></div></div>`;
    } else if (state.submitted) {
      if (idx === correctIndex) {
        style = "bg-green-50 border-green-200 ring-1 ring-green-500";
        icon = '<div class="w-5 h-5 rounded-full bg-green-500 border-green-500 flex items-center justify-center"><span class="material-symbols-outlined text-white text-sm">check</span></div>';
      } else if (idx === state.selected) {
        style = "bg-red-50 border-red-200 ring-1 ring-red-500";
        icon = '<div class="w-5 h-5 rounded-full border-red-500 flex items-center justify-center"><span class="material-symbols-outlined text-red-500 text-sm">close</span></div>';
      } else {
        style = "bg-slate-50 border-slate-200 opacity-55";
      }
    }
    const clickAttr = !state.submitted ? `onclick="selectQuizOption('${id}', ${idx})"` : '';
    return `
      <div ${clickAttr} class="choice-card p-4 rounded-2xl border cursor-pointer transition-all duration-200 flex items-center gap-3 mb-3 ${style}">
        ${icon}

function initClinicalVideos() {
  const blocks = document.querySelectorAll('[data-clinical-video-block="1"]');
  if (!blocks.length) return;

  blocks.forEach(block => {
    const posterBtn = block.querySelector('[data-cv-poster]');
    const wrap = block.querySelector('[data-cv-wrap]');
    const replay = block.querySelector('[data-cv-replay]');
    const progress = block.querySelector('[data-cv-progress]');
    const status = block.querySelector('[data-cv-status]');
    const video = block.querySelector('[data-cv-video]');
    if (!posterBtn || !wrap) return;

    let timer = null;
    let pct = 0;
    const phases = [
      { limit: 18, label: 'Opening case' },
      { limit: 42, label: 'Reviewing presentation' },
      { limit: 68, label: 'Assessing findings' },
      { limit: 100, label: 'Observation complete' }
    ];

    const stopPlayback = () => {
      if (timer) { clearInterval(timer); timer = null; }
    };

    const runPlayback = () => {
      stopPlayback();
      pct = 0;
      if (progress) progress.style.width = '0%';
      if (status) status.textContent = 'Starting...';

      timer = setInterval(() => {
        pct = Math.min(100, pct + 4);
        if (progress) progress.style.width = pct + '%';
        const phase = phases.find(p => pct <= p.limit) || phases[phases.length - 1];
        if (status) status.textContent = phase.label;
        if (pct >= 100) stopPlayback();
      }, 280);
    };

    const showVideo = () => {
      posterBtn.classList.add('swap-hidden');
      posterBtn.classList.remove('swap-visible');
      posterBtn.disabled = true;
      wrap.classList.remove('hidden');
      requestAnimationFrame(() => {
        wrap.classList.remove('swap-hidden');
        wrap.classList.add('swap-visible', 'sim-fade');
      });
      wrap.scrollIntoView({ behavior:'smooth', block:'center' });
      runPlayback();

      if (video) {
        video.currentTime = 0;
        const playPromise = video.play();
        if (playPromise && typeof playPromise.catch === 'function') {
          playPromise.catch(() => {
            if (status) status.textContent = 'Video blocked by browser, use controls to start playback';
          });
        }
        video.addEventListener('error', () => {
          if (status) status.textContent = 'Video file missing, observation text still available';
        }, { once: true });
      }
    };

    posterBtn.addEventListener('click', showVideo);

    if (replay) {
      replay.addEventListener('click', (e) => {
        e.stopPropagation();
        runPlayback();
        if (video) {
          video.currentTime = 0;
          const playPromise = video.play();
          if (playPromise && typeof playPromise.catch === 'function') playPromise.catch(() => {});
        }
      });
    }
  });
}

      <span class="px-3 py-1.5 bg-blue-100 text-blue-700 rounded-full text-xs font-bold uppercase tracking-wide">Interactive</span>
    </div>
    ${sectionIntro('The Transition Cliff', 'A college transition case showing how adherence can fail when patients lose structure, coordination, and adult-care readiness support.', 'escalator_warning')}
    <div class="section-card rounded-3xl p-6 md:p-7">
      <div class="flex gap-4 mb-6">
        <div class="w-12 h-12 bg-slate-200 rounded-full flex-shrink-0 flex items-center justify-center text-xl text-slate-600 font-bold">D</div>
        <div>
          <h3 class="font-bold text-lg text-slate-800">David</h3>
          <p class="text-slate-600">18-year-old male with X-linked agammaglobulinemia who recently moved away for college.</p>
        </div>
      </div>
      ${renderClinicalVideoBlock('david-pid', 'David', 'https://images.unsplash.com/photo-1517673132405-a56a62b18caf?auto=format&fit=crop&q=80&w=1200', 'case3.mp4', 'Clinical Observation: David was never formally transitioned to an adult care model. He felt overwhelmed by insurance complexities and missed his last two SC IgRT infusions, resulting in a severe sinus infection requiring hospitalization.', { posterMaxClass: 'max-h-[380px] mx-auto rounded-2xl' })}
    </div>
    ${renderQuizComponent('quiz-david-pid', 'In addition to poor transition protocols, what comorbid factor affects roughly 40% of young adults with PID, further complicating their adherence during care transitions?', ['Early-onset dementia', 'High psychiatric morbidity (anxiety/depression)', 'Severe early-onset osteoarthritis', 'Chronic liver failure'], 1, 'Correct. Approximately 40% of young adults with PID report significant anxiety or depression, which is often exacerbated by navigating a new healthcare landscape without a dedicated transition coordinator.')}
    <div class="section-card rounded-3xl p-6 bg-gradient-to-r from-green-50 to-emerald-50 border-green-200">
      <div class="flex flex-wrap items-center justify-between gap-4">
        <div>
          <div class="text-[11px] uppercase tracking-[0.22em] text-green-700 font-bold">Module Finish</div>
          <div class="text-2xl font-extrabold text-slate-900 mt-1">Ready to complete the PID module</div>
          <p class="text-slate-600 mt-2 max-w-2xl">Use the completion button below to close out the track and preserve your progress in the browser.</p>
        </div>
        <button onclick="completeModule()" class="bg-green-600 text-white px-6 py-3 rounded-xl font-semibold hover:bg-green-700 transition flex items-center gap-2 shadow-lg shadow-green-600/20">Complete Module <span class="material-symbols-outlined">check_circle</span></button>
      </div>
    </div>
    <div class="flex justify-between pt-2">
      <button onclick="navigateTo('pid', 'case-sarah')" class="text-slate-500 hover:text-blue-600 font-medium flex items-center gap-2"><span class="material-symbols-outlined">arrow_back</span> Back</button>
      <button onclick="completeModule()" class="bg-green-600 text-white px-6 py-3 rounded-xl font-semibold hover:bg-green-700 transition flex items-center gap-2 shadow-lg shadow-green-600/20">Complete Module <span class="material-symbols-outlined">check_circle</span></button>
    </div>
  `);

  return '';
}

function renderMainContent() {
  const module = appData.modules[activeModuleId];
  const section = module.sections.find(s => s.id === activeSectionId);
  document.getElementById('breadcrumb-module').textContent = module.title;
  document.getElementById('breadcrumb-section').textContent = section.title;
  const contentContainer = document.getElementById('main-content');
  contentContainer.innerHTML = getSectionContent(activeModuleId, activeSectionId);
  contentContainer.scrollTop = 0;
  renderSidebar();
  initClinicalVideos();
  saveState();

  if (window.innerWidth < 768) {
    document.getElementById('sidebar').classList.add('-translate-x-full');
    document.getElementById('sidebar-overlay').classList.add('hidden');
  }
}
function navigateTo(modId, secId) {
  activeModuleId = modId;
  activeSectionId = secId;
  renderMainContent();
}
function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebar-overlay');
  if (sidebar.classList.contains('-translate-x-full')) {
    sidebar.classList.remove('-translate-x-full');
    overlay.classList.remove('hidden');
  } else {
    sidebar.classList.add('-translate-x-full');
    overlay.classList.add('hidden');
  }
}
window.selectQuizOption = function(qid, idx) {
  if (!quizStates[qid]) quizStates[qid] = { submitted:false };
  quizStates[qid].selected = idx;
  renderMainContent();
};
window.submitQuiz = function(qid) {
  if (!quizStates[qid]) return;
  quizStates[qid].submitted = true;
  renderMainContent();
};
window.completeModule = function() {
  appData.modules[activeModuleId].sections.forEach(section => { completedSections[section.id] = true; });
  saveState();
  renderMainContent();
  window.scrollTo({ top: 0, behavior: 'smooth' });
};

document.addEventListener('DOMContentLoaded', () => {
  loadState();
  renderMainContent();
});
</script>
</body>
</html>
